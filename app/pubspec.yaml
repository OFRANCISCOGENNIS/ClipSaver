name: vidora
description: >-
  Vidora — gerenciador multiplataforma de downloads autorizados.
  Fase 3: aplicativo Flutter com as telas Analyze e Downloads sobre o
  domínio e a infraestrutura das fases anteriores.
publish_to: none
version: 0.3.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Delegates de Material/Cupertino/Widgets nos três idiomas (seção 16).
  flutter_localizations:
    sdk: flutter
  # Formatação de datas e números sensível ao locale.
  intl: ^0.20.0

  # Estado + injeção de dependência, testável e sem BuildContext (seção 5).
  flutter_riverpod: ^2.6.0
  # Navegação com deep links e guards de rota (seção 5).
  go_router: ^14.6.0
  # Modelos imutáveis de UiState (seção 4.1).
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # HTTP com cancelamento e progresso (seção 5).
  dio: ^5.7.0
  # Banco local reativo e tipado com migrations versionadas (seção 5).
  drift: ^2.28.0
  sqlite3: ^2.4.0
  # Verificação de integridade SHA-256 dos downloads (seção 8.3).
  crypto: ^3.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  lints: ^5.0.0

flutter:
  uses-material-design: true
  # Gera AppLocalizations a partir de lib/l10n/*.arb (ver l10n.yaml).
  generate: true

  # As fontes da seção 6 vão empacotadas. Elas eram declaradas no tema
  # desde a fase 3 e não existiam no bundle: o app caía na fonte padrão da
  # plataforma em todos os alvos — e na web o motor ainda buscava Roboto em
  # fonts.gstatic.com a cada carregamento, uma chamada a um terceiro num
  # app que pede consentimento explícito para telemetria.
  #
  # Subconjunto latino, só os pesos que o tema referencia: cada peso extra
  # é ~65KB no primeiro carregamento da web, e peso que ninguém usa é peso
  # morto. Ambas são OFL, e o texto da licença viaja junto no diretório.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
