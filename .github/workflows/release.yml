# Release builds for the six targets (section 3).
#
# Triggered by a `v*` tag, or manually for a dry run. Every job is
# independent so one platform's toolchain breaking does not hide the other
# five; the release itself only assembles what actually built.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the artifacts without publishing a release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Written only when the secrets exist. Without it build.gradle.kts
      # falls back to the debug keystore: the build still succeeds, but the
      # artifact is not publishable, and the step below says so out loud.
      - name: Write signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sem keystore nos secrets — artefato assinado com a chave de debug e NÃO publicável."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/vidora-release.jks
          cat > android/key.properties <<EOF
          storeFile=vidora-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # The keystore must not survive the job even if a later step fails.
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/vidora-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/app/outputs/bundle/release/*.aab
            app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned on purpose: signing needs an Apple Developer certificate
      # and a provisioning profile in the repository secrets. This proves
      # the iOS target compiles; `docs/release.md` covers the signed path.
      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 30

  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release

      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/vidora-macos.zip" Vidora.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: vidora-macos.zip
          retention-days: 30

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 30

  linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The Linux desktop embedder links against GTK 3; without these the
      # CMake configure step fails before any Dart is compiled.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Package
        run: tar -czf "$GITHUB_WORKSPACE/vidora-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vidora-linux-x64.tar.gz
          retention-days: 30

  web:
    name: Web (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: ./tool/fetch_web_assets.sh
      - run: flutter build web --release

      - name: Package
        run: tar -czf "$GITHUB_WORKSPACE/vidora-web.tar.gz" -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: vidora-web.tar.gz
          retention-days: 30

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [android, ios, macos, windows, linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.aab' -o -name '*.apk' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          # Checksums travel with the binaries: without them a mirrored
          # download cannot be told apart from a tampered one.
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
