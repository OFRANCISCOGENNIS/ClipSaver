# Publishes the Flutter Web build to GitHub Pages — the "site no ar" path
# that needs no external hosting account: the artifact lands at
# https://ofranciscogennis.github.io/ClipSaver/.
#
# Runs on every push to main and on demand. The `github-pages` environment
# is restricted to the default branch by default, which is the right
# guard: the public site only ever serves reviewed code.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
#
# What works on a static host: the library, the converter queue, the
# settings and the compliance onboarding all run from the browser, because
# the app's database is local (SQLite compiled to WASM). What does not work
# without a deployed API is the Analyze screen — eligibility is decided
# server-side on purpose (section 2.2: the client is never the authority on
# what may be downloaded), so with no API reachable it reports a connection
# error. Set the repository variable VIDORA_API_BASE_URL to point the site
# at a deployed backend.
name: Pages

on:
  push:
    branches: ["main"]
    # Server-only changes cannot alter the static site; rebuilding for them
    # would just burn minutes and re-publish identical bytes.
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel mid-publish: a half-uploaded deployment is worse than a
  # stale one, and Pages can be left with a pending deployment.
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # sqlite3.wasm / drift_worker.js: runtime binaries fetched by
      # version, not committed.
      - name: Fetch web runtime assets
        run: ./tool/fetch_web_assets.sh

      # Pages serves project sites under /<repo>/, so the base href must
      # match or every asset request 404s.
      - name: Build
        env:
          # Empty unless the repository variable is set; the app falls back
          # to its compiled-in default, and the Analyze screen reports a
          # connection error instead of pretending to have a verdict.
          API_BASE_URL: ${{ vars.VIDORA_API_BASE_URL }}
        run: |
          flutter build web --release \
            --base-href /ClipSaver/ \
            --dart-define=VIDORA_API_BASE_URL="${API_BASE_URL}"

      # SPA fallback: a deep link like /ClipSaver/downloads hits Pages as a
      # real path, and Pages answers 404 unless 404.html re-serves the app.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
