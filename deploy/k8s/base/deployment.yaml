apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidora-api
  labels:
    app.kubernetes.io/name: vidora-api
    app.kubernetes.io/component: api
spec:
  # Left unset on purpose: the HorizontalPodAutoscaler owns this field, and
  # a value here would fight it — every `kubectl apply` would reset the
  # scale the autoscaler had just decided on.
  selector:
    matchLabels:
      app.kubernetes.io/name: vidora-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer healthy pods than the current count while rolling: the
      # API is in the path of every analysis, so a rollout must not reduce
      # capacity even briefly.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vidora-api
        app.kubernetes.io/component: api
    spec:
      # Spread replicas across nodes so a single node failure cannot take
      # the whole deployment with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vidora-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Node's default is 30s; the app needs long enough to finish requests
      # in flight after it stops accepting new ones.
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          # Replaced at deploy time with an image pinned by digest.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: vidora-api-config
            - secretRef:
                name: vidora-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The image runs as non-root with a read-only root filesystem, so
          # anything that needs to write needs an explicit volume.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit: throttling an event loop turns a latency
              # spike into timeouts. Memory is limited because a leak must
              # kill one pod rather than starve the node.
              memory: 512Mi
          # Gives a cold start room to finish before liveness starts
          # counting, without delaying the first check on a warm pod.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            # One failed readiness check is usually a blip; three in a row
            # is a pod that should stop receiving traffic.
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and SIGTERM race: without this pause the
                # pod can stop accepting connections while the ingress is
                # still sending them, which users see as 502s mid-deploy.
                command: ["sleep", "5"]
      volumes:
        - name: tmp
          emptyDir: {}
