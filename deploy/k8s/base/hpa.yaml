apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vidora-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vidora-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # React quickly to load: an analysis queue that backs up is felt by
      # every user waiting on a verdict.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Come down slowly. Shedding replicas on a lull only to need them
      # again a minute later costs more than keeping them.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
