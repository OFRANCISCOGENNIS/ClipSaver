# Template only — never apply this file as-is, and never commit real
# values. Create the Secret out of band (sealed-secrets, SOPS, or the
# cluster's external secret operator); see docs/deploy.md.
#
# The Deployment mounts it with `envFrom`, so the keys here are exactly the
# environment variables the app validates at boot.
apiVersion: v1
kind: Secret
metadata:
  name: vidora-api-secrets
type: Opaque
stringData:
  # Refuses to boot in production if this still starts with "dev-only".
  JWT_SECRET: "trocar-por-um-segredo-de-32-bytes"
  DATABASE_URL: "postgresql://usuario:senha@postgres:5432/vidora"
  REDIS_URL: "redis://redis:6379"
